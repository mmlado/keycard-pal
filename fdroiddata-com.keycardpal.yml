Builds:
  - versionName: 1.11.1
    versionCode: 11101
    commit: v1.11.1
    subdir: android/app
    sudo:
      - apt-get update
      - curl -Lo node.tar.gz https://nodejs.org/dist/v22.22.2/node-v22.22.2-linux-x64.tar.gz
      - echo "978978a635eef872fa68beae09f0aad0bbbae6757e444da80b570964a97e62a3 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    init:
      - cd ../..
      - npm ci
    gradle:
      - full
    output: build/outputs/apk/full/release/keycard-pal-full-release-universal.apk
    rm:
      - ios
    prebuild:
      # Dead local Maven repo (async-storage 3.x dropped it). Drop this line once a
      # release carries the android/build.gradle cleanup.
      - sed -i -e '/^allprojects {/,/^}/d' ../build.gradle
    scanignore:
      # Hermes compiler: official prebuilt allowed by the Inclusion Policy.
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      # "unknown maven repo" false positives in files Gradle has to read.
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-encrypted-storage/android/build.gradle
      - node_modules/@react-native-community/blur/android/build.gradle
      - node_modules/@react-native-community/netinfo/android/build.gradle
    scandelete:
      - node_modules
    ndk: r27b
    gradleprops:
      - reactNativeArchitectures=arm64-v8a,armeabi-v7a

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.11.1
