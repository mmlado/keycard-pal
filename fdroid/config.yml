repo_name: "Keycard Pal"
repo_description: "Official Keycard Pal release repository"
repo_url: "https://fdroid.keycardpal.com/repo"
repo_icon: icon.png
repo_keyalias: repokey

keystore: ./keystore.p12
keystorepass: {env: FDROID_KEYSTORE_PASS}
keypass: {env: FDROID_KEY_PASS}
keydname: "CN=keycardpal.com, O=Keycard Pal, C=RS"

# Counts APKs per application id, not releases: two splits per release, so 6 keeps three releases.
archive_older: 6
allow_disabled_algorithms: false
