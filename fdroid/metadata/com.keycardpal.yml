Summary: Sign Ethereum and Bitcoin by QR code with a Keycard NFC smart card
Description: |
  Keycard Pal is an Android companion app for Status Keycard NFC smart cards.
  Signs Ethereum and Bitcoin requests without exposing private keys to a
  networked device: the keys never leave the card. Communication with watch-only
  wallets happens through animated QR codes (Blockchain Commons UR format);
  communication with the Keycard happens over NFC.

  This flavor declares the INTERNET permission for optional features:
  WalletConnect, ENS names, transaction simulation with Tenderly, and token
  images. Each one is off until you turn it on in Settings. WalletConnect needs
  your own Reown Project ID and simulation needs your own Tenderly API key.
  Signing by QR code is identical to Keycard Pal Offline and needs no network.
  If you require a build with no INTERNET permission declared, use Keycard Pal
  Offline (com.keycardpal.offline).

  Keycard Pal is made by an independent developer, not by Keycard. The Keycard
  team has provided equipment for its development.

