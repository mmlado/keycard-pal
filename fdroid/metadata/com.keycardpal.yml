AntiFeatures:
  Ads:
    en-US: Versions up to 1.16.0 open an affiliate link to the Keycard shop from their
      Buy a Keycard entries, and the developer earns a commission on purchases made
      through it. Later versions link to keycard.tech and earn nothing.
  NonFreeNet:
    en-US: Optional features, all disabled by default, connect to network services
      that are not free software. WalletConnect uses the Reown relay with a project
      ID you provide yourself, transaction simulation uses Tenderly with an API key
      you provide yourself, ENS names are looked up through a public Ethereum RPC
      endpoint you can change, token images are downloaded from CoinGecko, GitHub
      and CoinMarketCap, and clear-signing descriptors are downloaded from a GitHub
      address you can change. Signing by QR code works without any of them.
